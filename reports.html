<section id="report" class="section active">
<div class="page-header">
<h2>Academic Reports</h2>
<p class="page-sub">Your monthly academic scrolls.</p>
</div>
<div class="filter-bar">
<div class="filter-group"><span class="filter-label">Major</span><select id="rep-major" class="filter-select" onchange="filterReport()"></select></div>
<div class="filter-group"><span class="filter-label">Month</span><select id="rep-month" class="filter-select" onchange="filterReport()"></select></div>
<div class="filter-group"><span class="filter-label">Year</span><select id="rep-year" class="filter-select" onchange="filterReport()"></select></div>
</div>
<div id="report-content" class="report-grid"></div>
</section>
</main>
<script src="/config.js"></script>
<script src="/library.js"></script>
<script>
function filterReport() {
if (!db.library) return;
const fMaj = document.getElementById('rep-major').value;
const fMon = document.getElementById('rep-month').value;
const fYr = document.getElementById('rep-year').value;
const container = document.getElementById('report-content');

let filtered = db.report.slice(1).filter(row => {
return (fMaj === "All" || (row[2] || "").trim() === fMaj) &&
(fMon === "All" || (row[0] || "").trim() === fMon) &&
(fYr === "All" || (row[1] || "").trim() === fYr);
});

if(filtered.length === 0) { container.innerHTML = '<p style="text-align:center; font-style:italic; width:100%;">No reports found.</p>'; return; }

container.innerHTML = '';
filtered.forEach(row => {
let reportMonth = (row[0] || "").trim();
let reportYear = (row[1] || "").trim();
let reportMajor = (row[2] || "").trim();
let linkBtn = extractAndRenderButton(row[3], "Open report", "fa-envelope-open-text", "padding: 10px;");

container.innerHTML += `<div class="env" onclick="this.classList.toggle('open')"><div class="env-box"><div class="env-letter"><b>Academic Report</b><i></i><i></i><i></i></div><div class="env-front"></div><div class="env-flap"></div><div class="env-seal"><i class="fa-solid fa-feather-pointed"></i></div></div><div class="env-cap"><small>${reportMajor}</small><b>${reportMonth} ${reportYear}</b></div>${linkBtn}</div>`;
});
}
window.RC_POPULATE = function(d) { populateDropdown(d.report.slice(1), 2, 'rep-major', 'All Majors'); populateDropdown(d.report.slice(1), 0, 'rep-month', 'All Months'); populateDropdown(d.report.slice(1), 1, 'rep-year', 'All Years'); };
window.RC_RENDER = filterReport;
</script>
</body>
</html>
