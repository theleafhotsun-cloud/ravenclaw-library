<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Sign in · Library of Ravenclaw</title>
<style>
  :root { --navy:#03050c; --card:#0c1038; --gold:#E0C68F; --ink:#F5F0E9; --muted:rgba(245,240,233,.72); --err:#ff9b9b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display:flex; align-items:center; justify-content:center; padding:20px; background:radial-gradient(ellipse at 50% 0%, #131a52 0%, var(--navy) 62%); color:var(--ink); font:500 16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:420px; padding:30px 26px; border:1px solid rgba(224,198,143,.45); border-radius:18px; background:var(--card); box-shadow:0 0 40px rgba(224,198,143,.12); text-align:center; }
  h1 { margin:0 0 6px; font:700 24px/1.25 Georgia,"Times New Roman",serif; letter-spacing:.04em; color:var(--gold); }
  .sub { margin:0 0 20px; color:var(--muted); font-size:15px; }
  label { display:block; margin:14px 0 6px; text-align:left; font:700 11px/1 system-ui,sans-serif; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); }
  input { width:100%; padding:13px 14px; border-radius:12px; border:1px solid rgba(224,198,143,.4); background:#080b28; color:var(--ink); font:500 16px/1.2 system-ui,sans-serif; }
  input:focus { outline:2px solid var(--gold); outline-offset:1px; }
  button { width:100%; margin-top:20px; padding:14px 18px; border-radius:999px; border:1px solid var(--gold); background:var(--gold); color:#112250; font:700 12px/1 system-ui,sans-serif; letter-spacing:.22em; text-transform:uppercase; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:wait; }
  .msg { min-height:1.4em; margin:14px 0 0; font-size:14px; color:var(--err); text-align:left; }
  .info { margin:0; color:var(--muted); }
  .alt { margin:22px 0 0; padding-top:16px; border-top:1px solid rgba(224,198,143,.2); font-size:14px; color:var(--muted); }
  .alt a { color:var(--gold); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main class="card">
  <h1>Library of Ravenclaw</h1>

  <div id="checking">
    <p class="info" id="checking-text">Checking your account…</p>
  </div>

  <div id="form-wrap" hidden>
    <p class="sub">The Library is for members only. Sign in with your Ravenclaw account.</p>
    <form id="form" autocomplete="on" novalidate>
      <label for="u">Username</label>
      <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" maxlength="200" required>
      <p class="msg" id="msg" role="alert"></p>
      <button type="submit" id="go">Sign in</button>
    </form>
    <p class="alt">Or enter through the main site: sign in on your account page, then press <b>Enter the Library</b>.<br><a id="home" href="https://ravenclaw-website.vercel.app/profile">Open account page</a></p>
  </div>
</main>

<script>
(function () {
  'use strict';

  /* abis login mau ke mana: cuma path di situs library ini sendiri (jangan pernah situs lain) */
  var next = new URLSearchParams(location.search).get('next') || '/';
  if (!/^\/(?![\/\\])/.test(next) || /[\u0000-\u001f]/.test(next) || /^\/(login|_gate)(\/|\.|\?|$)/.test(next)) next = '/';

  var $ = function (id) { return document.getElementById(id); };
  function showForm(message) {
    $('checking').hidden = true;
    $('form-wrap').hidden = false;
    $('msg').textContent = message || '';
    $('u').focus();
  }
  function go() { location.replace(next); }
  function post(body) {
    return fetch('/_gate/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      credentials: 'same-origin',
      cache: 'no-store'
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'The server reply was not recognized.' }; });
    }, function () {
      return { ok: false, error: 'Could not reach the server. Check your connection and try again.' };
    });
  }

  /* 1. Ticket dari situs utama ada di bagian # alamat: ambil, terus hapus dari history */
  var ticket = '';
  var m = /(?:^#|&)ticket=([0-9a-f]{64})(?:&|$)/.exec(location.hash);
  if (m) {
    ticket = m[1];
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* cuekin aja */ }
  }

  if (ticket) {
    $('checking-text').textContent = 'Checking your entry ticket…';
    post({ ticket: ticket }).then(function (j) {
      if (j && j.ok) return go();
      showForm((j && j.error ? j.error + ' ' : '') + 'Sign in with your username and password, or open the Library again from your account page.');
    });
  } else {
    /* 2. Siapa tau udah punya session yang valid */
    fetch('/_gate/me', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.ok) go(); else showForm(''); })
      .catch(function () { showForm(''); });
  }

  /* 3. Sign in langsung pakai username + password */
  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var u = $('u').value.trim(), p = $('p').value;
    if (!u || !p) { $('msg').textContent = 'Enter your username and password.'; return; }
    $('go').disabled = true;
    $('msg').textContent = '';
    post({ username: u, password: p }).then(function (j) {
      if (j && j.ok) return go();
      $('go').disabled = false;
      $('msg').textContent = (j && j.error) || 'Sign-in failed.';
      $('p').value = '';
      $('p').focus();
    });
  });
})();
</script>
</body>
</html>
