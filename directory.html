<div class="filter-group"><span class="filter-label">Level</span><select id="gui-level" class="filter-select" onchange="filterClassGuide()"></select></div>

</section>

<script src="/rc-music.js" defer></script>
<script>
function filterClassGuide() {
if (!db.library) return;
const fLvl = document.getElementById('gui-level').value;
const fSub = document.getElementById('gui-sub').value;
const container = document.getElementById('classguide-content');

let filtered = db.classGuide.slice(1).filter(row => row[0] && row[1]).filter(row => {
return (fLvl === "All" || row[0].trim() === fLvl) &&
(fSub === "All" || row[1].trim() === fSub);
});
if(filtered.length === 0) { container.innerHTML = '<p class="pt-empty">No guide found.</p>'; return; }

container.innerHTML = '';
filtered.forEach(row => {
let classRoomBtn = extractAndRenderButton(row[3], "Enter Class", "fa-door-open", "padding: 6px 12px; width: auto; font-size: 0.75rem;");
let rulesBtn = extractAndRenderButton(row[4], "View Rules", "fa-scroll", "padding: 6px 12px; width: auto; font-size: 0.75rem; background: rgba(224, 181, 143, 0.1); border: 1px solid var(--text-gold); color: var(--text-gold) !important; box-shadow: none; text-shadow: none;");

let profRaw = (row[2] || "").trim();
let profData = extractLinkAndName(profRaw);
let profHtml = "";

if (profData.url) {
profHtml = `<a href="${profData.url}" target="_blank" style="color: var(--text-gold); text-decoration: none; font-weight: 600; border-bottom: 1px dashed var(--text-gold); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: 0.3s;" onclick="event.stopPropagation();"><i class="fa-solid fa-user-tie"></i> ${profData.name}</a>`;
} else {
profHtml = `<span style="font-weight: 600; color: var(--text-gold-light); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;"><i class="fa-solid fa-user-tie" style="color:var(--text-gold);"></i> ${profData.name || profRaw}</span>`;
}

const hdr = db.classGuide[0] || [];
let extra = '';
row.forEach(function(v, i) {
if (i < 7 || !v || !String(v).trim()) return;
const x = extractLinkAndName(v);
const val = x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener" style="color:var(--text-gold)">' + esc(x.name) + '</a>' : esc(x.name);
extra += '<div style="grid-column:1/-1"><small>' + esc(hdr[i] || 'Info') + '</small><b>' + val + '</b></div>';
});
const cs=getBookCoverStyle(row[1]||"");
container.innerHTML += `<article class="pt" style="--bg:${cs.bg}"><div class="pt-frame"><div class="pt-art"><i class="fa-solid ${cs.icon}"></i><span class="pt-lvl">${row[0]||""}</span></div></div><div class="pt-info"><h3>${row[1]||""}</h3><div class="pt-prof">${profHtml}</div><div class="pt-meta"><div><small>Late tolerance</small><b>${row[5]||"-"}</b></div><div><small>Final deadline</small><b>${row[6]||"-"}</b></div>${extra}</div><div class="pt-act">${classRoomBtn}${rulesBtn}</div></div></article>`;
});
}
window.RC_POPULATE = function(d) { populateDropdown(d.classGuide.slice(1), 0, 'gui-level', 'All Levels'); populateDropdown(d.classGuide.slice(1), 1, 'gui-sub', 'All Subjects'); };
window.RC_RENDER = filterClassGuide;
</script>
</body>
</html>
